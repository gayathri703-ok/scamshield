<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ScamShield Admin Login</title>

  <link rel="stylesheet" href="login.css">
</head>
<body>

  <div class="login-container">

    <form id="loginForm">

      <h1>Admin Login</h1>

      <input
        type="email"
        id="email"
        placeholder="Enter Email"
        required
      >

      <input
        type="password"
        id="password"
        placeholder="Enter Password"
        required
      >

      <button type="submit">
        Login
      </button>

      <p id="message"></p>

    </form>

  </div>

  <script src="login.js"></script>

</body>
</html>
